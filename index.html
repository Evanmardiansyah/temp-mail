<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Temp Mail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .modal-enter { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        /* Loading Spinner */
        .spinner { border: 3px solid rgba(0,0,0,0.1); width: 24px; height: 24px; border-radius: 50%; border-left-color: #0f172a; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col items-center pt-20 px-4 pb-10">

    <div class="w-full max-w-2xl">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-semibold tracking-tight text-slate-900">Disposable Email</h1>
            <p class="text-slate-500 mt-2 text-sm">Alamat email sementara Anda. Otomatis terhapus dalam 1 jam.</p>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between mb-8">
            <div class="flex items-center space-x-3 overflow-hidden">
                <i data-lucide="mail" class="text-slate-400 w-5 h-5 flex-shrink-0"></i>
                <span id="email-display" class="font-medium text-lg truncate text-slate-700">Memuat...</span>
            </div>
            <button onclick="copyEmail(event)" class="ml-4 flex items-center px-4 py-2 bg-slate-900 text-white rounded-lg hover:bg-slate-800 transition text-sm font-medium shrink-0">
                <i data-lucide="copy" class="w-4 h-4 mr-2"></i> Copy
            </button>
        </div>

        <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4 flex justify-between items-center">
            Kotak Masuk
            <span id="loading-indicator" class="hidden text-xs text-blue-500 normal-case flex items-center"><div class="spinner w-3 h-3 mr-2 border-[2px]"></div> Memperbarui...</span>
        </h2>
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <ul id="inbox-list" class="divide-y divide-slate-100">
                <li class="p-8 text-center text-slate-500 flex flex-col items-center">
                    <i data-lucide="inbox" class="w-8 h-8 mb-3 text-slate-300"></i>
                    <p class="text-sm">Menunggu email masuk...</p>
                </li>
            </ul>
        </div>
    </div>

    <div id="email-modal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col modal-enter">
            <div class="p-5 border-b border-slate-100 flex justify-between items-start bg-slate-50 rounded-t-2xl">
                <div class="pr-4 w-full">
                    <h3 id="modal-subject" class="font-bold text-slate-900 text-xl mb-1 leading-tight">Memuat Subjek...</h3>
                    <p id="modal-sender" class="text-sm text-slate-600 font-medium">Dari: ...</p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-800 bg-white p-2 rounded-lg shadow-sm border border-slate-200 transition shrink-0">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="flex-1 relative w-full h-[65vh] bg-white rounded-b-2xl overflow-hidden">
                <iframe id="email-iframe" class="w-full h-full border-0" sandbox="allow-same-origin allow-popups"></iframe>
            </div>
        </div>
    </div>

    <script type="module">
        import PostalMime from 'https://cdn.jsdelivr.net/npm/postal-mime@2.2.14/+esm';

        // Inisialisasi Ikon
        lucide.createIcons();

        // Konfigurasi API
        const DOMAIN = "evan-cloud.my.id"; 
        const WORKER_URL = "https://temp-mail-api.evanmardiansyah38.workers.dev"; 
        
        let currentEmail = "";
        let emailsData = []; // Menyimpan data email utuh

        // Binding fungsi ke Window agar bisa dipanggil dari HTML
        window.copyEmail = function(event) {
            navigator.clipboard.writeText(currentEmail);
            const btn = event.currentTarget;
            const originalContent = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="check" class="w-4 h-4 mr-2"></i> Tersalin`;
            lucide.createIcons();
            setTimeout(() => { btn.innerHTML = originalContent; lucide.createIcons(); }, 2000);
        };

        window.openModal = function(index) {
            const email = emailsData[index];
            document.getElementById('modal-sender').innerText = `${email.from}`;
            document.getElementById('modal-subject').innerText = email.parsedSubject;
            
            // Masukkan isi HTML email ke dalam Iframe agar desain aslinya muncul
            document.getElementById('email-iframe').srcdoc = email.parsedHtml;
            document.getElementById('email-modal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('email-modal').classList.add('hidden');
            document.getElementById('email-iframe').srcdoc = ""; // Bersihkan memori iframe
        };

        function generateRandomEmail() {
            const randomString = Math.random().toString(36).substring(2, 8);
            return `${randomString}@${DOMAIN}`;
        }

        window.onload = () => {
            currentEmail = generateRandomEmail();
            document.getElementById('email-display').innerText = currentEmail;
            fetchEmails(); 
            setInterval(fetchEmails, 5000); 
        };

        async function fetchEmails() {
            try {
                document.getElementById('loading-indicator').classList.remove('hidden');
                
                const response = await fetch(`${WORKER_URL}/?email=${currentEmail}`);
                const data = await response.json();
                
                const inboxList = document.getElementById('inbox-list');
                
                if (data.length > 0 && data.length !== emailsData.length) {
                    const parser = new PostalMime();
                    emailsData = data.reverse(); 
                    
                    let htmlBuilder = "";
                    
                    // Ekstrak isi email satu per satu
                    for (let i = 0; i < emailsData.length; i++) {
                        const email = emailsData[i];
                        const time = new Date(email.date).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
                        
                        // Membedah kode MIME yang rumit menjadi bagian rapi (Subject & Body)
                        const parsed = await parser.parse(email.raw);
                        email.parsedSubject = parsed.subject || "(Tanpa Subjek)";
                        email.parsedHtml = parsed.html || parsed.text || "<p>Email ini tidak memiliki teks yang bisa dibaca.</p>";

                        htmlBuilder += `
                            <li onclick="openModal(${i})" class="p-5 hover:bg-slate-50 transition cursor-pointer border-b border-slate-100 last:border-0 group">
                                <div class="flex justify-between items-baseline mb-2">
                                    <span class="font-semibold text-slate-800 group-hover:text-blue-600 transition truncate pr-4">${email.from}</span>
                                    <span class="text-xs text-slate-400 bg-slate-100 px-2 py-1 rounded-md shrink-0">${time}</span>
                                </div>
                                <div class="flex items-center text-sm text-slate-600">
                                    <span class="font-medium truncate">${email.parsedSubject}</span>
                                </div>
                            </li>
                        `;
                    }
                    
                    inboxList.innerHTML = htmlBuilder;
                    lucide.createIcons();
                }
            } catch (error) {
                console.error("Menunggu email masuk...", error);
            } finally {
                document.getElementById('loading-indicator').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
