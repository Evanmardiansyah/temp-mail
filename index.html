<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Temp Mail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        /* Animasi Pop-up */
        .modal-enter { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col items-center pt-20 px-4 pb-10">

    <div class="w-full max-w-2xl">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-semibold tracking-tight text-slate-900">Disposable Email</h1>
            <p class="text-slate-500 mt-2 text-sm">Alamat email sementara Anda. Otomatis terhapus dalam 1 jam.</p>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between mb-8">
            <div class="flex items-center space-x-3 overflow-hidden">
                <i data-lucide="mail" class="text-slate-400 w-5 h-5 flex-shrink-0"></i>
                <span id="email-display" class="font-medium text-lg truncate text-slate-700">Memuat...</span>
            </div>
            <button onclick="copyEmail()" class="ml-4 flex items-center px-4 py-2 bg-slate-900 text-white rounded-lg hover:bg-slate-800 transition text-sm font-medium shrink-0">
                <i data-lucide="copy" class="w-4 h-4 mr-2"></i> Copy
            </button>
        </div>

        <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-4">Kotak Masuk</h2>
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <ul id="inbox-list" class="divide-y divide-slate-100">
                <li class="p-8 text-center text-slate-500 flex flex-col items-center">
                    <i data-lucide="inbox" class="w-8 h-8 mb-3 text-slate-300"></i>
                    <p class="text-sm">Menunggu email masuk...</p>
                </li>
            </ul>
        </div>
    </div>

    <div id="email-modal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl max-h-[85vh] flex flex-col modal-enter">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <div>
                    <h3 class="font-semibold text-slate-900 text-lg">Detail Pesan Masuk</h3>
                    <p id="modal-sender" class="text-xs text-slate-500 mt-1">Dari: ...</p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-800 bg-white p-2 rounded-lg shadow-sm border border-slate-200 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto bg-white flex-1 relative">
                <div class="bg-slate-800 text-green-400 p-4 rounded-xl text-xs font-mono whitespace-pre-wrap break-words overflow-x-hidden" id="email-content">
                    Memuat isi pesan...
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Konfigurasi API
        const DOMAIN = "evan-cloud.my.id"; 
        const WORKER_URL = "https://temp-mail-api.evanmardiansyah38.workers.dev"; 
        
        let currentEmail = "";
        let emailsData = []; // Menyimpan data email agar bisa dipanggil saat diklik

        function generateRandomEmail() {
            const randomString = Math.random().toString(36).substring(2, 8);
            return `${randomString}@${DOMAIN}`;
        }

        window.onload = () => {
            currentEmail = generateRandomEmail();
            document.getElementById('email-display').innerText = currentEmail;
            fetchEmails(); 
            setInterval(fetchEmails, 5000); 
        };

        function copyEmail() {
            navigator.clipboard.writeText(currentEmail);
            const btn = event.currentTarget;
            const originalContent = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="check" class="w-4 h-4 mr-2"></i> Tersalin`;
            lucide.createIcons();
            setTimeout(() => { btn.innerHTML = originalContent; lucide.createIcons(); }, 2000);
        }

        // Fungsi Membuka Pop-up
        function openModal(index) {
            const email = emailsData[index];
            document.getElementById('modal-sender').innerText = `Pengirim: ${email.from}`;
            
            // Mencegah kode HTML bawaan email merusak tampilan web kita
            const safeRawText = email.raw.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            document.getElementById('email-content').innerHTML = safeRawText;
            document.getElementById('email-modal').classList.remove('hidden');
        }

        // Fungsi Menutup Pop-up
        function closeModal() {
            document.getElementById('email-modal').classList.add('hidden');
        }

        async function fetchEmails() {
            try {
                const response = await fetch(`${WORKER_URL}/?email=${currentEmail}`);
                const data = await response.json();
                
                const inboxList = document.getElementById('inbox-list');
                
                if (data.length > 0) {
                    emailsData = data.reverse(); // Simpan ke variabel global
                    inboxList.innerHTML = ''; 
                    
                    emailsData.forEach((email, index) => {
                        // Bikin waktu terima yang rapi
                        const time = new Date(email.date).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
                        
                        inboxList.innerHTML += `
                            <li onclick="openModal(${index})" class="p-5 hover:bg-slate-50 transition cursor-pointer border-b border-slate-100 last:border-0 group">
                                <div class="flex justify-between items-baseline mb-2">
                                    <span class="font-semibold text-slate-800 group-hover:text-blue-600 transition">${email.from}</span>
                                    <span class="text-xs text-slate-400 bg-slate-100 px-2 py-1 rounded-md">${time}</span>
                                </div>
                                <div class="flex items-center text-sm text-slate-500">
                                    <i data-lucide="file-text" class="w-4 h-4 mr-2 text-slate-400"></i>
                                    <span class="truncate">Klik untuk melihat isi kode (Raw Email)...</span>
                                </div>
                            </li>
                        `;
                    });
                    lucide.createIcons();
                }
            } catch (error) {
                console.error("Gagal menarik data:", error);
            }
        }
    </script>
</body>
</html>
